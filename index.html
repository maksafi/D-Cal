<!doctype html>
<html><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Discount Calculator</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
</head><body>
<div class="wrap">
<div class="glass">
<h1>Discount Calculator</h1>
<div class="grid">
<label>Market<input id="market" inputmode="numeric"></label>
<label>USD<input id="usd" inputmode="decimal"></label>
<label>Buy<input id="buy" inputmode="numeric"></label>
<label>Margin<input id="margin" inputmode="numeric"></label>
<label>Diff<input id="diff" inputmode="numeric"></label>
</div>
<div class="result">
<div class="caption">DISC</div>
<div id="disc">0</div>
</div>
<button id="clear">Clear All</button>
</div></div>
<script src="script.js"></script>
</body></html>

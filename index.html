<!doctype html>
<html><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
</head>
<body>
<div id="app">
  <div id="leftPane">
    <div id="form">
      <div class="field"><label for="market">Market</label><input id="market" inputmode="numeric"></div>
      <div class="field"><label for="usd">USD</label><input id="usd" inputmode="decimal"></div>
      <div class="field"><label for="buy">Buy</label><input id="buy" inputmode="numeric"></div>
      <div class="field"><label for="margin">Margin</label><input id="margin" inputmode="numeric"></div>
      <div class="field"><label for="diff">Diff</label><input id="diff" inputmode="numeric"></div>
      <div style="height:40px"></div>
    </div>
  </div>
  <aside id="discPane">
    <div id="discPanel">
      <div class="cap">DISC</div>
      <div id="disc">0</div>
    </div>
  </aside>
</div>
<script src="script.js"></script>
</body></html>

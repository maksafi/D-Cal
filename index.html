<!doctype html><html><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
<title>Discount Calculator</title></head><body>
<div id="app">

<div id="form">
<div class="row"><div class="lbl">Market</div><input id="market" inputmode="numeric"></div>
<div class="row"><div class="lbl">USD</div><input id="usd" inputmode="decimal"></div>
<div class="row"><div class="lbl">Buy</div><input id="buy" inputmode="numeric"></div>
<div class="row"><div class="lbl">Margin</div><input id="margin" inputmode="numeric"></div>
<div class="row"><div class="lbl">Diff</div><input id="diff" inputmode="numeric"></div>
<button id="clear">Clear All</button>
</div><div id="discPanel"><div class="cap">DISC</div><div id="disc">0</div></div></div>
<script src="script.js"></script></body></html>
